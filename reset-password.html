<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Himalayan Gateway — Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#061018;
  --panel:#102832;
  --gold:#d8b36a;
  --text:#f7fbfc;
  --muted:#9fb4bb;
  --line:#ffffff18;
  --green:#25D366;
  --red:#ff6b6b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#061018,#0b2029);
  color:var(--text);
}

.box{
  width:min(430px,100%);
  background:#ffffff0b;
  border:1px solid var(--line);
  border-radius:22px;
  padding:35px;
  box-shadow:0 20px 60px #0005;
}

.logo{
  font-size:25px;
  font-weight:900;
  margin-bottom:5px;
}

.logo span{
  color:var(--gold);
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:12px;
  color:#c8d7db;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#071820;
  color:white;
  outline:none;
  margin-bottom:14px;
}

button{
  width:100%;
  border:1px solid var(--line);
  background:#16313c;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.gold{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
}

.message{
  font-size:12px;
  line-height:1.5;
  margin-top:14px;
  min-height:18px;
}

.success{
  color:#5cff91;
}

.error{
  color:#ff8b8b;
}

.hidden{
  display:none!important;
}

.loading{
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

</style>
</head>

<body>

<div class="box">

  <div class="logo">
    HIMALAYAN<span>GATEWAY</span>
  </div>

  <div class="sub">
    Create a new password for your Admin Panel
  </div>

  <div id="loading" class="loading">
    Verifying password reset link...
  </div>

  <div id="resetForm" class="hidden">

    <label for="newPassword">
      New Password
    </label>

    <input
      id="newPassword"
      type="password"
      placeholder="Enter new password"
      autocomplete="new-password"
      minlength="8">

    <label for="confirmPassword">
      Confirm New Password
    </label>

    <input
      id="confirmPassword"
      type="password"
      placeholder="Re-enter new password"
      autocomplete="new-password"
      minlength="8">

    <button
      id="updateButton"
      class="gold"
      type="button"
      onclick="updatePassword()">

      Update Password

    </button>

    <div id="message" class="message"></div>

  </div>

  <div id="invalidBox" class="hidden">

    <div class="message error">
      This password reset link is invalid or has expired.
      Please request a new reset email from the Admin Login page.
    </div>

    <br>

    <button
      type="button"
      onclick="goToAdmin()">

      Back to Admin Login

    </button>

  </div>

</div>

<script>

const SUPABASE_URL =
  'https://nqulaiyzynywjkxvciuf.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_bwxR4v-Bg6N9uzafI9kO-Q_hT7Drrx_';

const { createClient } = window.supabase;

const supabaseClient =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

let recoveryReady = false;


/* =====================================================
   HELPERS
===================================================== */

function showResetForm(){

  document.getElementById('loading')
    .classList.add('hidden');

  document.getElementById('invalidBox')
    .classList.add('hidden');

  document.getElementById('resetForm')
    .classList.remove('hidden');

  recoveryReady = true;

}


function showInvalid(){

  document.getElementById('loading')
    .classList.add('hidden');

  document.getElementById('resetForm')
    .classList.add('hidden');

  document.getElementById('invalidBox')
    .classList.remove('hidden');

}


function goToAdmin(){

  window.location.href =
    'https://riddhigroup.github.io/bhutantourism/admin.html';

}


/* =====================================================
   PASSWORD UPDATE
===================================================== */

async function updatePassword(){

  const password =
    document.getElementById('newPassword')
      .value;

  const confirm =
    document.getElementById('confirmPassword')
      .value;

  const message =
    document.getElementById('message');

  const button =
    document.getElementById('updateButton');

  message.className = 'message';
  message.textContent = '';

  if(!recoveryReady){

    message.classList.add('error');
    message.textContent =
      'Your reset session is not ready.';

    return;

  }

  if(password.length < 8){

    message.classList.add('error');
    message.textContent =
      'Password must be at least 8 characters.';

    return;

  }

  if(password !== confirm){

    message.classList.add('error');
    message.textContent =
      'Passwords do not match.';

    return;

  }

  button.disabled = true;
  button.textContent = 'Updating...';

  try{

    const {data,error} =
      await supabaseClient.auth.updateUser({
        password:password
      });

    if(error) throw error;

    message.classList.add('success');
    message.textContent =
      'Password updated successfully. Redirecting to Admin Login...';

    /*
      Sign out after changing the password so the user
      must log in again with the new password.
    */
    await supabaseClient.auth.signOut();

    setTimeout(() => {

      window.location.href =
        'https://riddhigroup.github.io/bhutantourism/admin.html';

    },1200);

  }catch(error){

    console.error(
      'Password update error:',
      error
    );

    message.classList.add('error');
    message.textContent =
      error.message ||
      'Could not update password. Please request a new reset link.';

    button.disabled = false;
    button.textContent = 'Update Password';

  }

}


/* =====================================================
   RECOVERY SESSION
===================================================== */

async function checkRecoverySession(){

  try{

    /*
      Supabase JS reads the recovery tokens from the
      URL hash and establishes the recovery session.
    */
    const {data,error} =
      await supabaseClient.auth.getSession();

    if(error) throw error;

    if(data.session){

      showResetForm();
      return;

    }

    /*
      Listen for the PASSWORD_RECOVERY event as an
      additional safety net for the redirect flow.
    */
    const {
      data: authListener
    } =
      supabaseClient.auth.onAuthStateChange(
        (event,session) => {

          if(
            event === 'PASSWORD_RECOVERY' &&
            session
          ){

            showResetForm();

          }

        }
      );

    /*
      Give Supabase a short moment to process the
      recovery hash before declaring the link invalid.
    */
    setTimeout(async () => {

      if(recoveryReady) return;

      const {
        data:sessionCheck
      } =
        await supabaseClient.auth.getSession();

      if(sessionCheck.session){

        showResetForm();

      }else{

        showInvalid();

      }

    },1000);

  }catch(error){

    console.error(
      'Recovery session error:',
      error
    );

    showInvalid();

  }

}


checkRecoverySession();

</script>

</body>
</html>
